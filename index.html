<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Financial Promptbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px;">
      <button type="button" onclick="setLanguage('en')" class="lang-btn active" id="lang-en">🇬🇧 EN</button>
      <button type="button" onclick="setLanguage('fr')" class="lang-btn" id="lang-fr">🇫🇷 FR</button>
    </div>
    <h2 id="title" style="margin-top: 0; margin-bottom: 6px;">✨ AI Financial Promptbook</h2>
    <p id="subtitle" style="color: #9CA3AF; font-size: 13px; margin-top: 0; margin-bottom: 20px;">Generate your mathematical metrics & expert prompts in 1 click.</p>
    <div class="tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('stocks')" id="btn-stocks">📈 Stock</button>
      <button type="button" class="tab-btn" onclick="switchTab('tax')" id="btn-tax">🇺🇸 Tax</button>
      <button type="button" class="tab-btn" onclick="switchTab('debt')" id="btn-debt">🛡️ Debt</button>
      <button type="button" class="tab-btn" onclick="switchTab('budget')" id="btn-budget">💰 Budget</button>
    </div>
    <div class="form-group">
      <label id="input-label">Stock Ticker Symbol</label>
      <input type="text" id="main-input" value="AAPL" />
    </div>
    <button type="button" class="main-btn" onclick="handleExecution()" id="action-btn">🚀 Generate Metrics & Prompt</button>
    <div class="dashboard" id="dashboard" style="display: none;">
      <h4 id="dash-title" style="color: #10B981; margin-top: 0; margin-bottom: 12px; font-size: 14px;">📊 Your Conscious Spending Plan</h4>
      <div class="dash-row"><span id="label-fixed" style="color: #9CA3AF">🏠 Fixed Costs (55%):</span><strong id="dash-fixed">$0 / month</strong></div>
      <div class="dash-row"><span id="label-invest" style="color: #9CA3AF">📈 Investments (10%):</span><strong id="dash-invest" style="color: #10B981">$0 / month</strong></div>
      <div class="dash-row"><span id="label-save" style="color: #9CA3AF">🛡️ Savings (7%):</span><strong id="dash-save">$0 / month</strong></div>
      <div class="dash-row" style="border: none; font-weight: bold; margin-bottom: 0; padding-bottom: 0;"><span id="label-pleasure" style="color: #A7F3D0">🥳 Guilt-Free Spending (28%):</span><strong id="dash-pleasure" style="color: #A7F3D0">$0 / month</strong></div>
    </div>
    <div class="prompt-box" id="prompt-box" style="display: none;">
      <h3 id="prompt-box-title" style="color: #10B981; margin-top: 0; margin-bottom: 10px; font-size: 14px;">📋 Your Custom AI Expert Prompt:</h3>
      <textarea id="prompt-text" readonly style="width: 100%; height: 150px; background: #0B0F19; color: #A7F3D0; border: 1px solid #374151; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; box-sizing: border-box; margin-bottom: 12px;"></textarea>
      <button type="button" class="copy-btn" onclick="copyPrompt()" id="copy-btn" style="width: 100%; padding: 12px; background: #047857; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;">📋 Copy Prompt</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
